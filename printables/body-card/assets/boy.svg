<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D3B4"/>
      <stop offset="1" stop-color="#EFBA95"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42324F"/>
      <stop offset="1" stop-color="#241A2E"/>
    </linearGradient>
    <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E80F8"/>
      <stop offset="1" stop-color="#2357C4"/>
    </linearGradient>
    <linearGradient id="shortsG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D5896"/>
      <stop offset="1" stop-color="#1B3B6C"/>
    </linearGradient>
    <linearGradient id="shoeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDF7"/>
    </linearGradient>
  </defs>

  <!-- ================= shadow ================= -->
  <ellipse cx="200" cy="738" rx="116" ry="14" fill="#0B1B3A" opacity="0.08"/>

  <!-- ================= legs ================= -->
  <g id="legs">
    <path d="M134 518 h58 l-2 136 q0 14 -27 14 -27 0 -27 -14 z" fill="url(#skinG)"/>
    <path d="M208 518 h58 l-2 136 q0 14 -27 14 -27 0 -27 -14 z" fill="url(#skinG)"/>
    
    <ellipse cx="160" cy="610" rx="12" ry="8" fill="#E3A67F" opacity="0.25"/>
    <ellipse cx="240" cy="610" rx="12" ry="8" fill="#E3A67F" opacity="0.25"/>
  </g>

  <!-- ================= shoes ================= -->
  <g id="shoes">
    <g transform="translate(400,0) scale(-1,1)">
      <g transform="translate(22.8,0) scale(0.86,1)">
        <path d="M132 666 q0 -16 17 -16 h30 q17 0 18 16 l5 36 q1 12 -12 12 h-50 q-13 0 -12 -12 z" fill="url(#shoeG)" stroke="#C9D5E6" stroke-width="2"/>
        <path d="M120 698 q0 -10 12 -10 h76 q12 0 12 11 v11 q0 11 -12 11 h-76 q-12 0 -12 -11 z" fill="#EEF3FB" stroke="#C9D5E6" stroke-width="2"/>
        <path d="M139 672 q22 -9 55 0" stroke="#C9D5E6" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M137 682 q24 -9 59 0" stroke="#C9D5E6" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="158" cy="708" r="3.6" fill="#2F6FED" opacity="0.8"/>
        <circle cx="181" cy="708" r="3.6" fill="#2F6FED" opacity="0.8"/>
      </g>
    </g>
    <g transform="translate(22.8,0) scale(0.86,1)">
      <path d="M132 666 q0 -16 17 -16 h30 q17 0 18 16 l5 36 q1 12 -12 12 h-50 q-13 0 -12 -12 z" fill="url(#shoeG)" stroke="#C9D5E6" stroke-width="2"/>
      <path d="M120 698 q0 -10 12 -10 h76 q12 0 12 11 v11 q0 11 -12 11 h-76 q-12 0 -12 -11 z" fill="#EEF3FB" stroke="#C9D5E6" stroke-width="2"/>
      <path d="M139 672 q22 -9 55 0" stroke="#C9D5E6" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M137 682 q24 -9 59 0" stroke="#C9D5E6" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="158" cy="708" r="3.6" fill="#2F6FED" opacity="0.8"/>
      <circle cx="181" cy="708" r="3.6" fill="#2F6FED" opacity="0.8"/>
    </g>
  </g>

  <!-- ================= shorts ================= -->
  <g id="shorts">
    <path d="M127 428 h146 q9 0 9 10 v100 q0 10 -10 10 h-56 q-7 0 -8 -7 l-8 -49 -8 49 q-1 7 -8 7 h-56 q-10 0 -10 -10 v-100 q0 -10 9 -10 z" fill="url(#shortsG)"/>
    <path d="M200 470 v62" stroke="#152F59" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    <path d="M134 452 h132" stroke="#3D6FB2" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- ================= arms ================= -->
  <g id="arms">
    <!-- arm -->
    <path d="M152 330 C131 372 120 428 118 492" stroke="url(#skinG)" stroke-width="35" stroke-linecap="round" fill="none"/>
    <path d="M248 330 C269 372 280 428 282 492" stroke="url(#skinG)" stroke-width="35" stroke-linecap="round" fill="none"/>
    <!-- hands -->
    <path d="M118 486 q-18 2 -20 22 -2 22 10 32 12 9 24 1 10 -8 6 -24 -4 -20 -4 -31 z" fill="url(#skinG)"/>
    <path d="M282 486 q18 2 20 22 2 22 -10 32 -12 9 -24 1 -10 -8 -6 -24 4 -20 4 -31 z" fill="url(#skinG)"/>
    <path d="M108 508 q2 20 6 28" stroke="#DFA47E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M118 512 q2 17 4 24" stroke="#DFA47E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M292 508 q-2 20 -6 28" stroke="#DFA47E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M282 512 q-2 17 -4 24" stroke="#DFA47E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- ================= neck ================= -->
  <path d="M177 274 h46 v44 q0 13 -23 13 -23 0 -23 -13 z" fill="#EDB58E"/>
  <path d="M177 274 h46 v18 q-23 11 -46 0 z" fill="#D89A74" opacity="0.8"/>

  <!-- ================= t-shirt ================= -->
  <g id="shirt">
    <!-- sleeves -->
    <path d="M152 318 q-24 10 -38 32 -14 22 -18 44 -2 12 8 14 l20 4 q8 2 12 -2 6 -6 6 -16 4 -24 12 -44 7 -18 16 -30 z" fill="url(#shirtG)"/>
    <path d="M248 318 q24 10 38 32 14 22 18 44 2 12 -8 14 l-20 4 q-8 2 -12 -2 -6 -6 -6 -16 -4 -24 -12 -44 -7 -18 -16 -30 z" fill="url(#shirtG)"/>
    <path d="M102 394 q26 6 50 -2" stroke="#1B4CA9" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M298 394 q-26 6 -50 -2" stroke="#1B4CA9" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>

    <!-- torso -->
    <path d="M172 306 q28 17 56 0 l14 4 q22 7 27 28 5 22 4 56 0 34 -2 48 -2 12 -14 12 h-114 q-12 0 -14 -12 -2 -14 -2 -48 -1 -34 4 -56 5 -21 27 -28 z" fill="url(#shirtG)"/>
    <!-- soft folds -->
    <path d="M140 420 q18 8 34 2" stroke="#1B4CA9" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <path d="M226 422 q18 6 34 -2" stroke="#1B4CA9" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- collar -->
    <path d="M172 306 q28 22 56 0 -5 16 -14 20 -14 7 -28 0 -9 -4 -14 -20 z" fill="#1C4DAC"/>
    <path d="M180 312 q20 14 40 0" stroke="#5D95FB" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- ================= head ================= -->
  <g id="head">
    <!-- ears -->
    <ellipse cx="123" cy="224" rx="14" ry="17" fill="url(#skinG)"/>
    <ellipse cx="277" cy="224" rx="14" ry="17" fill="url(#skinG)"/>
    <path d="M120 220 q6 5 0 11" stroke="#DEA079" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M280 220 q-6 5 0 11" stroke="#DEA079" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- face -->
    <path d="M200 126
             C 158 126 126 156 124 200
             C 122 244 132 278 156 294
             C 170 304 184 308 200 308
             C 216 308 230 304 244 294
             C 268 278 278 244 276 200
             C 274 156 242 126 200 126 Z" fill="url(#skinG)"/>

    <!-- blush -->
    <ellipse cx="152" cy="256" rx="15" ry="8.5" fill="#F08B7C" opacity="0.35"/>
    <ellipse cx="248" cy="256" rx="15" ry="8.5" fill="#F08B7C" opacity="0.35"/>

    <!-- eyes -->
    <ellipse cx="168" cy="230" rx="16" ry="19" fill="#2B2136"/>
    <ellipse cx="232" cy="230" rx="16" ry="19" fill="#2B2136"/>
    <circle cx="162" cy="222" r="6.2" fill="#FFFFFF"/>
    <circle cx="226" cy="222" r="6.2" fill="#FFFFFF"/>
    <circle cx="174" cy="238" r="2.8" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="238" cy="238" r="2.8" fill="#FFFFFF" opacity="0.7"/>
    <path d="M152 214 q16 -12 32 0" stroke="#2B2136" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M216 214 q16 -12 32 0" stroke="#2B2136" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- brows -->
    <path d="M152 196 q16 -8 30 -1" stroke="#3A2C48" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M248 196 q-16 -8 -30 -1" stroke="#3A2C48" stroke-width="6.5" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M200 246 q-6 9 0 13 4 2 8 -1" stroke="#DC9C76" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M184 268 q16 14 32 0" stroke="#B25F4C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M191 274 q9 5 18 0" stroke="#CB7C67" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- hair: full cap, then fringe -->
    <path d="M200 104
             C 146 104 120 146 120 204
             L 120 224
             C 122 214 124 204 127 196
             C 133 178 146 168 160 166
             C 176 164 190 172 198 184
             C 206 172 220 162 236 164
             C 252 166 266 176 272 196
             C 275 204 277 214 279 224
             L 279 204
             C 279 146 254 104 200 104 Z" fill="url(#hairG)"/>
    <!-- hair mass over the top -->
    <path d="M200 102
             C 148 102 118 142 120 200
             C 121 214 123 218 125 222
             L 132 220
             C 131 214 130 208 130 200
             C 130 166 146 144 168 136
             C 186 130 202 132 216 138
             C 240 148 268 168 270 200
             C 270 208 269 214 268 220
             L 275 222
             C 277 216 279 210 280 200
             C 282 142 252 102 200 102 Z" fill="url(#hairG)"/>

    <!-- swept fringe -->
    <path d="M126 206
             C 124 160 148 128 186 122
             C 226 116 268 140 274 190
             C 268 176 258 166 248 162
             C 236 157 224 160 214 168
             C 206 174 202 184 200 192
             C 196 180 190 170 180 166
             C 168 161 154 166 146 178
             C 138 190 134 198 132 210 Z" fill="url(#hairG)"/>

    <!-- cowlick -->
    <path d="M193 106 q4 -16 20 -15 q-13 7 -15 20 z" fill="url(#hairG)"/>

    <!-- sideburns -->
    <path d="M124 206 q-2 18 3 30 l10 -2 q-6 -13 -5 -27 z" fill="url(#hairG)"/>
    <path d="M276 206 q2 18 -3 30 l-10 -2 q6 -13 5 -27 z" fill="url(#hairG)"/>

    <!-- hair highlights -->
    <path d="M150 152 q34 -22 74 -12" stroke="#544365" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M146 178 q10 -14 24 -20" stroke="#544365" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
