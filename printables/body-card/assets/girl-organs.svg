    <path d="M150 679 q22 -8 49 0" stroke="#FBE3D6" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <circle cx="166" cy="699" r="3.4" fill="#FBE3D6" opacity="1"/>
    <circle cx="186" cy="699" r="3.4" fill="#FBE3D6" opacity="1"/>
