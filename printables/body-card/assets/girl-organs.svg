      <path d="M136 688 q0 -9 11 -9 h62 q11 0 11 10 v10 q0 10 -11 10 h-62 q-11 0 -11 -10 z" fill="#FBE3D6" stroke="#FBE3D6" stroke-width="2"/>
      <path d="M152 670 q20 -8 45 0" stroke="#FBE3D6" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <path d="M150 679 q22 -8 49 0" stroke="#FBE3D6" stroke-width="3.6" fill="none" stroke-linecap="round"/>
