<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBD9BE"/>
      <stop offset="1" stop-color="#F2C1A0"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3A2E"/>
      <stop offset="1" stop-color="#3A231B"/>
    </linearGradient>
    <linearGradient id="dressG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9CC0"/>
      <stop offset="1" stop-color="#EE6F9E"/>
    </linearGradient>
    <linearGradient id="shoeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3E7F2"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="200" cy="726" rx="112" ry="14" fill="#0B1B3A" opacity="0.08"/>

  <!-- ================= legs ================= -->
  <g id="legs">
    <path d="M146 524 h50 l-3 126 q-1 20 -24 20 -23 0 -24 -20 z" fill="url(#skinG)"/>
    <path d="M204 524 h50 l3 126 q0 20 -24 20 -23 0 -24 -20 z" fill="url(#skinG)"/>
    <ellipse cx="168" cy="600" rx="12" ry="9" fill="#E9AE8B" opacity="0.3"/>
    <ellipse cx="232" cy="600" rx="12" ry="9" fill="#E9AE8B" opacity="0.3"/>
  </g>

  <!-- ================= shoes ================= -->
  <g id="shoes">
    <!-- left -->
    <path d="M144 662 q0 -15 16 -15 h26 q16 0 17 15 l4 32 q1 11 -11 11 h-43 q-12 0 -11 -11 z" fill="url(#shoeG)" stroke="#EBD9E9" stroke-width="2"/>
    <path d="M136 688 q0 -9 11 -9 h62 q11 0 11 10 v10 q0 10 -11 10 h-62 q-11 0 -11 -10 z" fill="#FFF6FB" stroke="#EBD9E9" stroke-width="2"/>
    <path d="M152 670 q20 -8 45 0" stroke="#F0D8EC" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <path d="M150 679 q22 -8 49 0" stroke="#F0D8EC" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <circle cx="166" cy="699" r="3.4" fill="#EE6F9E" opacity="0.85"/>
    <circle cx="186" cy="699" r="3.4" fill="#EE6F9E" opacity="0.85"/>
    <!-- right -->
    <g transform="translate(400,0) scale(-1,1)">
      <path d="M144 662 q0 -15 16 -15 h26 q16 0 17 15 l4 32 q1 11 -11 11 h-43 q-12 0 -11 -11 z" fill="url(#shoeG)" stroke="#EBD9E9" stroke-width="2"/>
      <path d="M136 688 q0 -9 11 -9 h62 q11 0 11 10 v10 q0 10 -11 10 h-62 q-11 0 -11 -10 z" fill="#FFF6FB" stroke="#EBD9E9" stroke-width="2"/>
      <path d="M152 670 q20 -8 45 0" stroke="#F0D8EC" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <path d="M150 679 q22 -8 49 0" stroke="#F0D8EC" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <circle cx="166" cy="699" r="3.4" fill="#EE6F9E" opacity="0.85"/>
      <circle cx="186" cy="699" r="3.4" fill="#EE6F9E" opacity="0.85"/>
    </g>
  </g>

  <!-- ================= arms (behind dress) ================= -->
  <g id="arms">
    <path d="M150 366 C 124 402 108 448 104 500" stroke="url(#skinG)" stroke-width="33" stroke-linecap="round" fill="none"/>
    <path d="M250 366 C 276 402 292 448 296 500" stroke="url(#skinG)" stroke-width="33" stroke-linecap="round" fill="none"/>
    <path d="M104 494 q-18 2 -20 21 -2 22 9 31 11 9 23 1 10 -8 6 -23 -4 -19 -4 -30 z" fill="url(#skinG)"/>
    <path d="M296 494 q18 2 20 21 2 22 -9 31 -11 9 -23 1 -10 -8 -6 -23 4 -19 4 -30 z" fill="url(#skinG)"/>
    <path d="M93 515 q2 19 6 27" stroke="#E4A886" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M103 519 q2 16 4 22" stroke="#E4A886" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M307 515 q-2 19 -6 27" stroke="#E4A886" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M297 519 q-2 16 -4 22" stroke="#E4A886" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ================= dress ================= -->
  <g id="dress">
    <!-- puff sleeves -->
    <path d="M148 362 q-30 4 -42 26 -8 16 4 24 12 9 28 3 12 -5 16 -18 4 -16 -6 -35 z" fill="url(#dressG)"/>
    <path d="M252 362 q30 4 42 26 8 16 -4 24 -12 9 -28 3 -12 -5 -16 -18 -4 -16 6 -35 z" fill="url(#dressG)"/>
    <path d="M112 396 q22 6 40 -2" stroke="#DE5C8C" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M288 396 q-22 6 -40 -2" stroke="#DE5C8C" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round"/>

    <!-- bodice -->
    <path d="M172 350 q28 16 56 0 l14 4 q22 7 27 28 4 20 6 40 l-146 0 q2 -20 6 -40 5 -21 27 -28 z" fill="url(#dressG)"/>
    <!-- collar -->
    <path d="M172 350 q28 22 56 0 -4 15 -13 19 -15 7 -30 0 -9 -4 -13 -19 z" fill="#F7BBD2"/>
    <!-- waist ribbon -->
    <path d="M118 414 h164 q6 0 6 8 v12 q0 8 -6 8 h-164 q-6 0 -6 -8 v-12 q0 -8 6 -8 z" fill="#F7BBD2"/>
    <circle cx="200" cy="428" r="9" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="200" cy="428" r="4" fill="#EE6F9E"/>

    <!-- skirt -->
    <path d="M116 438 h168 l13 76 q3 16 -14 16 h-166 q-17 0 -14 -16 z" fill="url(#dressG)"/>
    <!-- skirt folds -->
    <g stroke="#DE5C8C" stroke-width="3.4" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M152 442 l-7 84"/>
      <path d="M200 442 v86"/>
      <path d="M248 442 l7 84"/>
    </g>
    <!-- hem -->
    <path d="M104 514 q96 13 192 0" stroke="#F7BBD2" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= head ================= -->
  <g id="head">
    <!-- pigtails -->
    <g id="pigtails">
      <path d="M118 214 q-34 10 -40 44 -6 34 14 44 16 8 26 -10 10 -20 8 -44 z" fill="url(#hairG)"/>
      <path d="M282 214 q34 10 40 44 6 34 -14 44 -16 8 -26 -10 -10 -20 -8 -44 z" fill="url(#hairG)"/>
      <path d="M96 244 q10 10 8 34" stroke="#6B4738" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
      <path d="M304 244 q-10 10 -8 34" stroke="#6B4738" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- ears -->
    <ellipse cx="112" cy="248" rx="14" ry="17" fill="url(#skinG)"/>
    <ellipse cx="288" cy="248" rx="14" ry="17" fill="url(#skinG)"/>
    <path d="M109 244 q6 5 0 11" stroke="#E4A886" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M291 244 q-6 5 0 11" stroke="#E4A886" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- face -->
    <path d="M200 142
             C 152 142 116 174 114 226
             C 112 282 130 322 162 338
             C 175 345 187 348 200 348
             C 213 348 225 345 238 338
             C 270 322 288 282 286 226
             C 284 174 248 142 200 142 Z" fill="url(#skinG)"/>

    <!-- blush -->
    <ellipse cx="146" cy="278" rx="17" ry="10" fill="#F58BA0" opacity="0.4"/>
    <ellipse cx="254" cy="278" rx="17" ry="10" fill="#F58BA0" opacity="0.4"/>

    <!-- eyes -->
    <ellipse cx="164" cy="254" rx="18" ry="21" fill="#3B2A33"/>
    <ellipse cx="236" cy="254" rx="18" ry="21" fill="#3B2A33"/>
    <circle cx="158" cy="246" r="6.6" fill="#FFFFFF"/>
    <circle cx="230" cy="246" r="6.6" fill="#FFFFFF"/>
    <circle cx="171" cy="263" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="243" cy="263" r="3" fill="#FFFFFF" opacity="0.7"/>
    <path d="M148 237 q16 -13 33 0" stroke="#3B2A33" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <path d="M219 237 q16 -13 33 0" stroke="#3B2A33" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <!-- lashes -->
    <path d="M146 234 q-5 -6 -8 -4" stroke="#3B2A33" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M254 234 q5 -6 8 -4" stroke="#3B2A33" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- brows -->
    <path d="M148 218 q16 -8 31 -1" stroke="#4A3027" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M252 218 q-16 -8 -31 -1" stroke="#4A3027" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M200 270 q-6 9 0 13 4 2 8 -1" stroke="#E4A886" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M184 292 q16 14 32 0" stroke="#C26070" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M191 298 q9 5 18 0" stroke="#DE8494" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- hair -->
    <path d="M200 126
             C 146 126 112 166 112 226
             C 112 240 113 250 116 260
             L 126 256
             C 123 244 122 234 122 224
             C 122 184 142 158 168 150
             C 188 144 214 146 232 154
             C 258 166 278 188 278 224
             C 278 234 277 244 274 256
             L 284 260
             C 287 250 288 240 288 226
             C 288 166 254 126 200 126 Z" fill="url(#hairG)"/>
    <!-- fringe -->
    <path d="M118 214
             C 116 160 146 128 188 124
             C 230 120 274 146 282 196
             C 274 184 262 172 250 168
             C 236 163 224 168 214 178
             C 208 184 204 192 202 200
             C 198 188 192 178 182 172
             C 168 163 152 168 142 182
             C 132 194 126 202 124 216 Z" fill="url(#hairG)"/>
    <!-- hair shine -->
    <path d="M142 168 q38 -24 82 -14" stroke="#7A5442" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.45"/>

    <!-- bows -->
    <g id="bows">
      <path d="M108 206 q-18 -14 -26 0 q8 14 26 6 z" fill="#FF7FB0"/>
      <path d="M108 206 q18 -14 26 0 q-8 14 -26 6 z" fill="#FF7FB0"/>
      <circle cx="108" cy="209" r="6" fill="#F0568F"/>
      <path d="M292 206 q18 -14 26 0 q-8 14 -26 6 z" fill="#FF7FB0"/>
      <path d="M292 206 q-18 -14 -26 0 q8 14 26 6 z" fill="#FF7FB0"/>
      <circle cx="292" cy="209" r="6" fill="#F0568F"/>
    </g>
  </g>
</svg>
